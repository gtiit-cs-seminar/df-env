name: Publish Docker image

# Builds the image for amd64 + arm64 and publishes it to GHCR.
# After the first publish, make the package public on GitHub
# (Packages > df-env > Package settings > Change visibility)
# so students can pull it without logging in.

on:
  push:
    branches: [main]
    # Docs and helper scripts aren't part of the image.
    paths-ignore: ['**.md', 'devcontainer-template/**', 'open-vscode.*', 'export-tars.sh']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/df-env

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
